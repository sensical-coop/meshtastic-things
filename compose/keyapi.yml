x-keyapi-image: &keyapi-image
  image: meshtastic-things/keyapi:latest
  build:
    context: ../meshtastic_things
    dockerfile: keyapi/Dockerfile

services:
  key_management_api:
    environment:
      DJANGO_SETTINGS_MODULE: keyapi_project.settings.prod
    mem_limit: 512m
    container_name: key-management-api
    <<: *keyapi-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: "../.env"
    restart: unless-stopped
    ports:
      - 127.0.0.1:${KEYAPI__PORT}:${KEYAPI__PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${KEYAPI__PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  key_management_device_consumer:
    environment:
      DJANGO_SETTINGS_MODULE: keyapi_project.settings.prod

    mem_limit: 256m
    container_name: key-management-device-consumer
    <<: *keyapi-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      key_management_api:
        condition: service_healthy
    env_file: "../.env"
    restart: unless-stopped
    command: ["python", "manage.py", "consume_device_sightings"]

  key_management_sensor_discovery_consumer:
    environment:
      DJANGO_SETTINGS_MODULE: keyapi_project.settings.prod

    mem_limit: 256m
    container_name: key-management-sensor-discovery-consumer
    <<: *keyapi-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      key_management_api:
        condition: service_healthy
    env_file: "../.env"
    restart: unless-stopped
    command: ["python", "manage.py", "consume_sensor_discovery"]

  key_management_quality_alarms_consumer:
    environment:
      DJANGO_SETTINGS_MODULE: keyapi_project.settings.prod

    mem_limit: 256m
    container_name: key-management-quality-alarms-consumer
    <<: *keyapi-image
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      key_management_api:
        condition: service_healthy
    env_file: "../.env"
    restart: unless-stopped
    command: ["python", "manage.py", "consume_quality_alarms"]
